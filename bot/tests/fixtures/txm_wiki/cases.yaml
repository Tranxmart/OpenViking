    # Synthetic Artifact Relay update
    Artifact Relay (AR) still caches immutable build artifacts and verifies SHA-256.
    It now exports the diagnostic cache_probe_total, counted in requests.
    This adds a diagnostic; it does not remove compiler-digest validation or change
    any other service. No trusted timestamp or uploader metadata is supplied.

